server:
  http_listen_port: 9080

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: tracee
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=tracee"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_label_logging]
        target_label: job
    pipeline_stages:
      - json:
          expressions:
            timestamp:    timestamp
            processName:  processName
            hostName:     hostName
            eventName:    eventName
            syscall:      syscall
            type:         type
            threadID:     threadID
      - labels:
          eventName:
          processName:
          type:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
