[workspace]
members = [
    "rscaller-proto",
    "rsbeacon",
    "rsclient",
    "rscaller-run",
    "tools/codegen",
]
exclude = []
resolver = "2"

# To build only the core members offline (without rscaller-run / ociman):
#   cargo build --workspace --exclude rscaller-run

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
bincode = "1"
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
tokio-rustls = "0.26"
thiserror = "1"
async-trait = "0.1"
