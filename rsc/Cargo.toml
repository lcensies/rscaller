[package]
name = "rsc"
version = "0.1.0"
edition = "2021"
description = "rsc — run binaries/images/shells with syscalls forwarded to a remote rsbeacon"

[[bin]]
name = "rsc"
path = "src/main.rs"

[features]
default = ["container"]
container = ["dep:tokio", "dep:ociman"]
# relay enables `rsc exec --profile qemu-relay`. It requires libvirt-dev
# on the build host, so it is opt-in.
relay = ["dep:qemu-vdw-core"]

[dependencies]
anyhow = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
ctls = { path = "../ctls", default-features = false, features = ["seccomp"] }
rscfuse = { path = "../rscfuse" }
qemu-vdw-core = { path = "../qemu-vdw-core", optional = true }
rustls = { workspace = true }
rcgen = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true, optional = true }
ociman = { git = "https://github.com/mbj/mrs", optional = true }
