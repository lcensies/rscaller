[package]
name = "rsc"
version = "0.1.0"
edition = "2021"
description = "rsc — run binaries/images/shells with syscalls forwarded to a remote rsbeacon"

[[bin]]
name = "rsc"
path = "src/main.rs"

[features]
default = ["container"]
container = ["dep:tokio", "dep:ociman"]

[dependencies]
anyhow = { workspace = true }
libc = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
rscfuse = { path = "../rscfuse" }
rustls = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true, optional = true }
ociman = { git = "https://github.com/mbj/mrs", optional = true }
