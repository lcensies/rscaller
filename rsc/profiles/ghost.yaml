name: ghost
description: "Beacon process control — merged local+beacon procfs at /proc, rootfs at /mnt/target; kill forwarded with local-cgroup exclusion"
mounts:
  # rscfuse merges local PIDs with beacon PIDs (+10,000,000) for ps/top/kill.
  - remote: /proc
    local: /proc
    type: bind
  # Full beacon rootfs exposed read/write at /mnt/target.
  - remote: /
    local: /mnt/target
    type: bind
    optional: true
forward:
  - name: signal
    syscalls: [kill, tgkill, tkill]
    filter:
      # PIDs inside the session-local cgroup are locally-spawned processes.
      # Continue their kill() locally; forward everything else to beacon.
      cgroup: local
