[package]
name = "rsbeacon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rsbeacon"
path = "src/main.rs"

[lib]
name = "rsbeacon"
path = "src/lib.rs"

[dependencies]
rscaller-proto = { path = "../rscaller-proto" }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
libc = { workspace = true }
rustls = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
log = "0.4"
smoltcp = { version = "0.13.1", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp", "socket-udp", "iface-max-addr-count-4", "iface-max-route-count-4", "auto-icmp-echo-reply", "log"] }
aya = "0.14.0"

[build-dependencies]
rcgen = "0.13"

[dev-dependencies]
tokio = { workspace = true }
libc = { workspace = true }
