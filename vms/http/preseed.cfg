# Ubuntu 24.04 LTS preseed configuration for automated installation
# This file provides answers for the Ubuntu installer to run without user interaction

# Basic system configuration
d-i debian-installer/locale string en_US.UTF-8
d-i console-setup/ask_detect boolean false
d-i console-setup/layoutcode string us
d-i console-setup/modelcode string pc105
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/variantcode string

# Network configuration
d-i netcfg/get_domain string vm
d-i netcfg/get_hostname string vagrant
d-i netcfg/choose_interface select auto
d-i netcfg/get_nameservers string 1.1.1.1
d-i netcfg/confirm_static boolean true

# Clock and timezone
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# User account setup
d-i passwd/user-fullname string Vagrant User
d-i passwd/username string vagrant
d-i passwd/user-password password vagrant
d-i passwd/user-password-again password vagrant
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# Root account
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true

# Partitioning
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Package selection
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server build-essential git vim curl wget

# Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# Finish installation
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string \
    in-target apt-get update; \
    in-target apt-get install -y openssh-server; \
    in-target systemctl enable ssh; \
    in-target mkdir -p /home/vagrant/.ssh; \
    in-target chmod 700 /home/vagrant/.ssh; \
    in-target chown vagrant:vagrant /home/vagrant/.ssh; \
    in-target echo "ssh-rsa  vagrant insecure public key" > /home/vagrant/.ssh/authorized_keys; \
    in-target chmod 600 /home/vagrant/.ssh/authorized_keys; \
    in-target chown vagrant:vagrant /home/vagrant/.ssh/authorized_keys; \
    in-target echo "vagrant ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/vagrant; \
    in-target chmod 440 /etc/sudoers.d/vagrant

# Disable automatic updates
d-i pkgsel/update-policy select none